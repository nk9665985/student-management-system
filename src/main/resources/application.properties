# Public demo configuration. Do not put production secrets in this file.
# Render/production values should be supplied through environment variables.

spring.application.name=student-ms

# H2 in-memory database makes a fresh clone runnable without external setup.
spring.datasource.url=jdbc:h2:mem:studentdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/schema.sql
spring.sql.init.data-locations=classpath:db/data.sql
spring.jpa.open-in-view=false

# Demo-only JWT configuration. Override JWT_SECRET in production.
jwt.secret=${JWT_SECRET:demo-secret-key-for-local-development-only-123456789}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Demo-only legacy login. Override these in production if this login is retained.
spring.security.user.name=${ADMIN_USERNAME:crni99}
spring.security.user.password=${ADMIN_PASSWORD:student}

# Helpful for local development only.
spring.h2.console.enabled=true
